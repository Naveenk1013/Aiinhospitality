  --a: #2e7d4f;
  --a2: #e3f3e8;

}
@media (prefers-color-scheme: dark) {

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
}
.box {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;

  box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

  font-size: 4rem;
  font-weight: 800;
  color: var(--a);
  line-height: 1;
  margin: 0 0 10px;
}
h1 {
  font-size: 1.4rem;
  margin: 0 0 10px;
}
p {
  color: var(--mute);
  font-size: 0.95rem;
  margin: 0 0 24px;
}
.nav-links {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 20px;
}
.nav-btn {
  text-decoration: none;
  background: var(--bg);
  border: 1px solid var(--line);
  color: var(--ink);
  padding: 10px 14px;
  border-radius: 10px;
  font-weight: 600;
  font-size: 0.9rem;
  transition: all 0.2s;
}
.nav-btn:hover {
  background: var(--a2);
  border-color: var(--a);
  color: var(--a);
}
.primary-btn {
  background: var(--a);
  color: #fff !important;
  border-color: var(--a);
}
.primary-btn:hover {
  filter: brightness(1.1);
}
